name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Plugin bauen
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${RELEASE_TAG}" ]; then export VERSION="${RELEASE_TAG#v}"; fi
          ./build.sh

      - name: JAR als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-Plugin
          path: build/ModernUI-Plugin.jar

      - name: JAR an Release anhängen (Tag v* oder veröffentlichtes Release)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: build/ModernUI-Plugin.jar
